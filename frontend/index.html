<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FruitHub: Fresh. Local. Within 5 KM.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="drops"></div>
    <div class="logo d"></div>
    <p class="intro-sub">Fresh. Local. Within 5 km.</p>
    <button class="skip" type="button">Skip</button>
  </div>

  <div id="site-header"></div>

  <main class="hero">
    <div class="glow"></div>
    <div class="hero-inner">
      <h1 class="d">
        <span class="line"><b style="--i:0">FRESH.</b></span>
        <span class="line"><b style="--i:1">LOCAL.</b></span>
        <span class="line"><b style="--i:2">WITHIN 5 KM.</b></span>
      </h1>
      <p>Fresh fruits delivered to your doorstep.</p>
      <div class="actions">
        <a class="btn solid" href="#">Explore fruits</a>
        <a class="btn" href="#">View offers</a>
      </div>
      <p class="note">The 3D fruit scene arrives in the next step.</p>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
