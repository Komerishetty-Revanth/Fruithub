<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in | FruitHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="auth">
    <div class="glow"></div>
    <span class="floaty a" aria-hidden="true">🥭</span>
    <span class="floaty b" aria-hidden="true">🍊</span>
    <section class="auth-card">
      <h1 class="d">Welcome back</h1>
      <p class="lead">Log in to order fresh fruit.</p>
      <form id="login-form" novalidate>
        <label class="field"><span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field"><span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <div class="form-error" id="form-error" role="alert"></div>
        <button class="btn solid" type="submit" id="submit-btn">Log in</button>
      </form>
      <p class="alt">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
